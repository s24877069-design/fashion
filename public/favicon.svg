<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Rich Metallic Gold Gradients -->
    <linearGradient id="goldRim" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#FFF4C2" />
      <stop offset="20%" stop-color="#E7C064" />
      <stop offset="45%" stop-color="#FDF2BA" />
      <stop offset="70%" stop-color="#B88523" />
      <stop offset="90%" stop-color="#7C5209" />
      <stop offset="100%" stop-color="#D4A745" />
    </linearGradient>

    <linearGradient id="goldBevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6" />
      <stop offset="35%" stop-color="#E5BE5E" />
      <stop offset="70%" stop-color="#9A6B12" />
      <stop offset="100%" stop-color="#5A3A03" />
    </linearGradient>

    <linearGradient id="goldBright" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF9DB" />
      <stop offset="50%" stop-color="#E5BE5E" />
      <stop offset="100%" stop-color="#B3801C" />
    </linearGradient>

    <!-- Deep Luxury Onyx Medallion Radial Gradient -->
    <radialGradient id="darkPlaque" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1C1A17" />
      <stop offset="45%" stop-color="#12100E" />
      <stop offset="85%" stop-color="#0A0908" />
      <stop offset="100%" stop-color="#050504" />
    </radialGradient>

    <!-- Subtle Radial Glow on Crest -->
    <radialGradient id="crestGlow" cx="50%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#E5BE5E" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#B88523" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadows for 3D Depth -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.9" />
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#E5BE5E" flood-opacity="0.25" />
    </filter>

    <filter id="softOuter" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.75" />
    </filter>
  </defs>

  <!-- Outer Drop Shadow -->
  <circle cx="256" cy="256" r="248" fill="#000000" opacity="0.6" filter="url(#softOuter)" />

  <!-- 1. Outer Master Gold Ring (Multi-tier Beveled) -->
  <circle cx="256" cy="256" r="244" fill="url(#goldRim)" stroke="#5A3A03" stroke-width="2" />
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#goldBevel)" stroke-width="3" opacity="0.9" />
  <circle cx="256" cy="256" r="226" fill="none" stroke="#2B1B01" stroke-width="2" opacity="0.7" />

  <!-- 2. Deep Obsidian Circular Medallion -->
  <circle cx="256" cy="256" r="222" fill="url(#darkPlaque)" />
  <circle cx="256" cy="256" r="222" fill="url(#crestGlow)" />

  <!-- 3. Inner Gold Beaded Border -->
  <circle cx="256" cy="256" r="217" fill="none" stroke="url(#goldRim)" stroke-width="2" />
  <circle cx="256" cy="256" r="211" fill="none" stroke="url(#goldBright)" stroke-width="2.5" stroke-dasharray="4,8" stroke-linecap="round" opacity="0.9" />
  <circle cx="256" cy="256" r="204" fill="none" stroke="url(#goldRim)" stroke-width="1.2" opacity="0.75" />

  <!-- ============================================== -->
  <!-- TOP APEX: ROYAL REGAL GOLD CROWN / TIARA       -->
  <!-- ============================================== -->
  <g filter="url(#goldGlow)" transform="translate(0, -6)">
    <!-- Crown Base Band -->
    <path d="M 212 96 C 226 93 286 93 300 96 L 297 104 C 283 102 229 102 215 104 Z" fill="url(#goldBright)" stroke="#694305" stroke-width="1" />
    <!-- Crown Pearls along Base -->
    <circle cx="222" cy="100" r="2.2" fill="#FFFFFF" />
    <circle cx="239" cy="99" r="2.2" fill="#FFFFFF" />
    <circle cx="256" cy="98.5" r="2.5" fill="#FFFFFF" />
    <circle cx="273" cy="99" r="2.2" fill="#FFFFFF" />
    <circle cx="290" cy="100" r="2.2" fill="#FFFFFF" />

    <!-- Crown Peaks / Spikes -->
    <!-- Center Highest Peak -->
    <path d="M 256 62 L 263 88 C 260 90 252 90 249 88 Z" fill="url(#goldRim)" stroke="#694305" stroke-width="0.8" />
    <!-- Left Inner Peak -->
    <path d="M 234 71 L 243 90 C 239 92 233 92 230 90 Z" fill="url(#goldRim)" stroke="#694305" stroke-width="0.8" />
    <!-- Right Inner Peak -->
    <path d="M 278 71 L 282 90 C 279 92 273 92 269 90 Z" fill="url(#goldRim)" stroke="#694305" stroke-width="0.8" />
    <!-- Left Outer Peak -->
    <path d="M 215 80 L 227 92 C 223 94 218 94 213 93 Z" fill="url(#goldRim)" stroke="#694305" stroke-width="0.8" />
    <!-- Right Outer Peak -->
    <path d="M 297 80 L 299 93 C 294 94 289 94 285 92 Z" fill="url(#goldRim)" stroke="#694305" stroke-width="0.8" />

    <!-- Crown Jewel Tips -->
    <circle cx="256" cy="60" r="4.2" fill="url(#goldBright)" stroke="#5A3A03" stroke-width="1" />
    <circle cx="256" cy="59" r="1.5" fill="#FFFFFF" />
    <circle cx="234" cy="69" r="3.2" fill="url(#goldBright)" stroke="#5A3A03" stroke-width="0.8" />
    <circle cx="278" cy="69" r="3.2" fill="url(#goldBright)" stroke="#5A3A03" stroke-width="0.8" />
    <circle cx="215" cy="78" r="2.6" fill="url(#goldBright)" stroke="#5A3A03" stroke-width="0.6" />
    <circle cx="297" cy="78" r="2.6" fill="url(#goldBright)" stroke="#5A3A03" stroke-width="0.6" />

    <!-- Crown Cross / Crest Cross Top -->
    <path d="M 256 50 L 256 57 M 253 53 L 259 53" stroke="url(#goldBright)" stroke-width="1.8" stroke-linecap="round" />
  </g>

  <!-- ============================================== -->
  <!-- CENTRAL HERALDIC MONOGRAM & LAUREL FLOURISHES  -->
  <!-- ============================================== -->
  <g filter="url(#goldGlow)">
    <!-- Laurel Wreath Leaves (Left Side) -->
    <g fill="url(#goldRim)" stroke="#5A3A03" stroke-width="0.6">
      <path d="M 166 148 C 158 136 172 126 182 134 C 180 144 172 150 166 148 Z" />
      <path d="M 148 180 C 138 170 150 158 162 164 C 160 174 154 182 148 180 Z" />
      <path d="M 138 218 C 126 210 136 196 150 200 C 150 212 144 220 138 218 Z" />
      <path d="M 138 258 C 126 254 132 240 146 242 C 148 254 144 262 138 258 Z" />
      <path d="M 148 298 C 138 298 140 282 154 282 C 158 294 154 302 148 298 Z" />
      <path d="M 168 334 C 158 336 158 322 172 318 C 178 328 174 336 168 334 Z" />
    </g>

    <!-- Laurel Wreath Leaves (Right Side) -->
    <g fill="url(#goldRim)" stroke="#5A3A03" stroke-width="0.6">
      <path d="M 346 148 C 354 136 340 126 330 134 C 332 144 340 150 346 148 Z" />
      <path d="M 364 180 C 374 170 362 158 350 164 C 352 174 358 182 364 180 Z" />
      <path d="M 374 218 C 386 210 376 196 362 200 C 362 212 368 220 374 218 Z" />
      <path d="M 374 258 C 386 254 380 240 366 242 C 364 254 368 262 374 258 Z" />
      <path d="M 364 298 C 374 298 372 282 358 282 C 354 294 358 302 364 298 Z" />
      <path d="M 344 334 C 354 336 354 322 340 318 C 334 328 338 336 344 334 Z" />
    </g>

    <!-- Wreath Vine Stems -->
    <path d="M 186 138 C 152 186 142 270 178 338" fill="none" stroke="url(#goldBright)" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 326 138 C 360 186 370 270 334 338" fill="none" stroke="url(#goldBright)" stroke-width="2.5" stroke-linecap="round" />

    <!-- ============================================== -->
    <!-- MASTER MONOGRAM EMBLEM: "R" WITH ROYAL FLOURISH -->
    <!-- ============================================== -->
    <!-- Vertical Spine of R with Luxury Serifs -->
    <path d="M 204 142 L 254 142 C 248 142 242 148 242 154 L 242 168 L 228 168 L 228 308 L 244 308 L 244 322 L 198 322 L 198 308 L 214 308 L 214 168 L 204 168 Z"
          fill="url(#goldBright)" stroke="#5A3A03" stroke-width="1.5" />
    <!-- 3D Bevel highlight on spine -->
    <path d="M 214 168 L 222 168 L 222 308 L 214 308 Z" fill="#FFFFFF" opacity="0.4" />

    <!-- Top Arch & Bowl of R -->
    <path d="M 228 142 L 290 142 C 326 142 348 162 348 196 C 348 226 324 246 290 248 L 242 248 L 242 232 L 284 232 C 308 232 328 218 328 196 C 328 172 308 158 284 158 L 228 158 Z"
          fill="url(#goldBright)" stroke="#5A3A03" stroke-width="1.5" />
    <!-- Inner Bowl Cutout Accent -->
    <circle cx="282" cy="195" r="3" fill="url(#goldRim)" />

    <!-- Sweeping Regal Leg of R with Royal S-Curve & Saree Pleat Silhouette -->
    <path d="M 276 238 C 292 254 316 272 334 290 C 352 308 368 324 372 332 C 356 332 332 320 306 292 C 286 272 268 254 250 244 C 262 250 282 274 298 298 C 314 322 330 338 348 344 C 330 342 304 326 284 302 C 264 278 252 256 248 244 Z"
          fill="url(#goldRim)" stroke="#5A3A03" stroke-width="1.2" />

    <!-- Polished Gold Filigree Accents intertwining with R -->
    <!-- Left Branching Vine -->
    <path d="M 214 210 C 196 200 188 170 206 156 C 214 150 222 158 214 168 C 206 178 210 192 226 198"
          fill="none" stroke="url(#goldBright)" stroke-width="3.5" stroke-linecap="round" />
    <!-- Lower Left Flourish -->
    <path d="M 214 260 C 190 248 182 280 198 300 C 206 310 220 298 212 286 C 206 276 216 264 232 268"
          fill="none" stroke="url(#goldBright)" stroke-width="3" stroke-linecap="round" />

    <!-- Royal Stars Flanking the Monogram -->
    <!-- Left 5-point Star -->
    <g transform="translate(182, 240) scale(0.9)">
      <polygon points="0,-10 3,-3 10,-3 4,2 6,9 0,5 -6,9 -4,2 -10,-3 -3,-3" fill="url(#goldBright)" stroke="#5A3A03" stroke-width="0.8" />
      <circle cx="0" cy="0" r="1.5" fill="#FFFFFF" />
    </g>
    <!-- Right 5-point Star -->
    <g transform="translate(330, 240) scale(0.9)">
      <polygon points="0,-10 3,-3 10,-3 4,2 6,9 0,5 -6,9 -4,2 -10,-3 -3,-3" fill="url(#goldBright)" stroke="#5A3A03" stroke-width="0.8" />
      <circle cx="0" cy="0" r="1.5" fill="#FFFFFF" />
    </g>
  </g>

  <!-- ============================================== -->
  <!-- LUXURY BANNER & TYPOGRAPHY: RENU FASHION HUB   -->
  <!-- ============================================== -->
  <!-- Curved Architectural Plaque / Banner Frame -->
  <g filter="url(#goldGlow)">
    <!-- Dark Inset Plaque for Text Contrast -->
    <path d="M 108 382 C 160 372 352 372 404 382 C 408 402 402 438 392 454 C 342 470 170 470 120 454 C 110 438 104 402 108 382 Z"
          fill="#0D0B09" stroke="url(#goldRim)" stroke-width="2" />
    <path d="M 116 388 C 164 380 348 380 396 388 C 392 410 388 436 382 448 C 336 462 176 462 130 448 C 124 436 120 410 116 388 Z"
          fill="none" stroke="url(#goldBright)" stroke-width="1" stroke-dasharray="2,4" opacity="0.8" />

    <!-- "RENU" DISPLAY TITLE (Prominent, High Legibility at Small Favicon Scales) -->
    <text x="256" y="418"
          text-anchor="middle"
          font-family="'Playfair Display', 'Cinzel', 'Georgia', serif"
          font-size="34"
          font-weight="900"
          letter-spacing="5"
          fill="url(#goldBright)"
          stroke="#422902"
          stroke-width="0.8">RENU</text>

    <!-- Horizontal Divider with Diamond -->
    <line x1="164" y1="428" x2="228" y2="428" stroke="url(#goldRim)" stroke-width="1.2" stroke-linecap="round" />
    <polygon points="256,425 259,428 256,431 253,428" fill="url(#goldBright)" />
    <line x1="284" y1="428" x2="348" y2="428" stroke="url(#goldRim)" stroke-width="1.2" stroke-linecap="round" />

    <!-- "FASHION HUB" SUBTITLE -->
    <text x="256" y="445"
          text-anchor="middle"
          font-family="'Plus Jakarta Sans', 'Montserrat', 'Helvetica Neue', sans-serif"
          font-size="13"
          font-weight="800"
          letter-spacing="5"
          fill="url(#goldRim)">FASHION HUB</text>
  </g>

  <!-- ============================================== -->
  <!-- BOTTOM ORNAMENTAL CREST / FLEUR-DE-LIS FINIAL -->
  <!-- ============================================== -->
  <g transform="translate(256, 474)" filter="url(#goldGlow)">
    <!-- Central Palmette / Finial -->
    <path d="M 0 -8 C -4 -5 -4 1 0 5 C 4 1 4 -5 0 -8 Z" fill="url(#goldBright)" />
    <!-- Left Leaf -->
    <path d="M -2 -1 C -7 -3 -12 0 -13 4 C -9 5 -4 2 -2 -1 Z" fill="url(#goldRim)" />
    <!-- Right Leaf -->
    <path d="M 2 -1 C 7 -3 12 0 13 4 C 9 5 4 2 2 -1 Z" fill="url(#goldRim)" />
    <!-- Diamond Jewel Accent -->
    <circle cx="0" cy="2" r="1.8" fill="#FFFFFF" />
  </g>

</svg>
